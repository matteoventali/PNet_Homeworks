# Kathará Lab Configuration
# Service Function Chaining with NSH and MPLS Tunnels

# Host Images
h1[image]="kathara/base"
h2[image]="kathara/base"
h3[image]="kathara/base"
h4[image]="kathara/base"

# Service Functions (can be implemented as P4 reflectors or simple base reflectors)
SF1[image]="kathara/p4"
SF2[image]="kathara/p4"
SF3[image]="kathara/p4"

# Underlay Core Switches/Routers
B[image]="kathara/base"
C[image]="kathara/base"
F[image]="kathara/base"
G[image]="kathara/base"
H[image]="kathara/base"

# Programmable SFC Nodes (P4 Switches)
A[image]="kathara/p4"
D[image]="kathara/p4"
E[image]="kathara/p4"

# --- Collision Domains / Links Assignment ---

# Host to Classifier (Node A)
h1[0]="h1_A"
A[0]="h1_A"

h2[0]="h2_A"
A[1]="h2_A"

# Classifier (A) to Underlay Core
A[2]="A_B"
B[0]="A_B"

A[3]="A_C"
C[0]="A_C"

# Underlay Mesh Connections
B[1]="B_C"
C[1]="B_C"

B[2]="B_D"
D[0]="B_D"

B[3]="B_F"
F[0]="B_F"

C[2]="C_E"
E[0]="C_E"

C[3]="C_G"
G[0]="C_G"

# SFF1 (D) Connections to Service Functions and Core
D[1]="D_F"
F[1]="D_F"

D[2]="D_SF1"
SF1[0]="D_SF1"

D[3]="D_SF2"
SF2[0]="D_SF2"

# SFF2 (E) Connections to Service Functions and Core
E[1]="E_G"
G[1]="E_G"

E[2]="E_SF3"
SF3[0]="E_SF3"

# Egress Core Connections
F[2]="F_G"
G[2]="F_G"

F[3]="F_H"
H[0]="F_H"

G[3]="G_H"
H[1]="G_H"

# Egress to Destination Hosts
H[2]="H_h3"
